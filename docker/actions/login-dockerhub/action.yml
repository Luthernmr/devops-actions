name: Login to DockerHub
description: Authenticates to DockerHub using username and password

inputs:
  dockerhub_username:
    description: "The username for DockerHub authentication"
    required: true
  dockerhub_password:
    description: "The password or access token for DockerHub authentication"
    required: true

runs:
  using: "composite"
  steps:
    - run: echo "${{ inputs.dockerhub_password }}" | docker login -u "${{ inputs.dockerhub_username }}" --password-stdin
      shell: bash
