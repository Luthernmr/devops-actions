name: Deploy to AWS Lambda
description: Deploys a Lambda function from a zip file or source code

inputs:
  function_name:
    description: "Name of the Lambda function"
    required: true
  oidc_role_arn:
    description: "ARN of the AWS IAM role to assume for Lambda deployment"
    required: true
  zip_file:
    description: "Path to the zip file containing the Lambda function code"
    required: false
  s3_bucket:
    description: "S3 bucket containing the Lambda function code"
    required: false
  s3_key:
    description: "S3 key of the Lambda function code"
    required: false
  source_directory:
    description: "Directory containing the Lambda function source code (will be zipped)"
    required: false
    default: "./src"
  runtime:
    description: "Lambda runtime (e.g., python3.9, nodejs18.x)"
    required: false
  handler:
    description: "Lambda function handler"
    required: false
    default: "main.lambda_handler"
  aws_region:
    description: "AWS region where the Lambda function is located"
    required: false
    default: "eu-west-3"
  timeout:
    description: "Function timeout in seconds"
    required: false
  memory_size:
    description: "Function memory size in MB"
    required: false
    default: "128"
  requirements_file:
    description: "Path to requirements.txt file (relative to source directory or current directory)"
    required: false
    default: "requirements.txt"
  python_version:
    description: "Python version for pip install (e.g., 3.9, 3.10, 3.11)"
    required: false
    default: "3.13"
  install_dependencies:
    description: "Whether to install Python dependencies from requirements.txt"
    required: false
    default: "true"
  deployment_timeout:
    description: "Maximum time in seconds to wait for deployment (default: 120)"
    required: false
    default: "120"
  package_timeout:
    description: "Maximum time in seconds to wait for package preparation (default: 90)"
    required: false
    default: "90"

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: ${{ inputs.oidc_role_arn }}
        role-session-name: cicd-role-session-name
        aws-region: ${{ inputs.aws_region }}

    - name: Set up Python
      if: ${{ inputs.install_dependencies == 'true' }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python_version }}

    - name: Prepare deployment package
      run: |
        # Make scripts executable
        chmod +x ${{ github.action_path }}/prepare-package.sh
        chmod +x ${{ github.action_path }}/deploy-function.sh
        chmod +x ${{ github.action_path }}/update-config.sh

        # Run package preparation script
        RESULT=$(${{ github.action_path }}/prepare-package.sh \
          "${{ inputs.zip_file }}" \
          "${{ inputs.source_directory }}" \
          "${{ inputs.requirements_file }}" \
          "${{ inputs.install_dependencies }}" \
          "${{ inputs.package_timeout }}")

        # Extract deployment package path from script output
        DEPLOYMENT_PACKAGE=$(echo "$RESULT" | grep "DEPLOYMENT_PACKAGE=" | cut -d'=' -f2)
        echo "DEPLOYMENT_PACKAGE=${DEPLOYMENT_PACKAGE}" >> $GITHUB_ENV

        # Print script output
        echo "$RESULT"
      shell: bash

    - name: Deploy Lambda function
      run: |
        ${{ github.action_path }}/deploy-function.sh \
          "${{ inputs.function_name }}" \
          "${DEPLOYMENT_PACKAGE}" \
          "${{ inputs.s3_bucket }}" \
          "${{ inputs.s3_key }}" \
          "${{ inputs.deployment_timeout }}"
      shell: bash

    - name: Update function configuration
      run: |
        ${{ github.action_path }}/update-config.sh \
          "${{ inputs.function_name }}" \
          "${{ inputs.runtime }}" \
          "${{ inputs.handler }}" \
          "${{ inputs.timeout }}" \
          "${{ inputs.memory_size }}"
      shell: bash

    - name: Cleanup temporary files
      if: always()
      run: |
        echo "🧹 Cleaning up temporary files..."
        rm -rf lambda-package lambda-deployment.zip 2>/dev/null || true
        echo "✅ Cleanup completed"
      shell: bash
