name: Deploy to AWS ECS

on:
  workflow_call:
    inputs:
      cluster_name:
        description: "Name of the ECS cluster"
        required: true
        type: string
      service_name:
        description: "Name of the ECS service"
        required: true
        type: string
      task_definition:
        description: "Path to the ECS task definition file or task definition family name"
        required: true
        type: string
      image_uri:
        description: "URI of the Docker image to deploy"
        required: true
        type: string
      container_name:
        description: "Name of the container in the task definition to update"
        required: true
        type: string
      aws_region:
        description: "AWS region where the ECS resources are located"
        required: true
        type: string
      wait_for_stability:
        description: "Whether to wait for the service to reach a stable state"
        required: false
        type: boolean
        default: true
      auto_rollback_on_failure:
        description: "Automatically rollback on deployment failure"
        required: false
        type: boolean
        default: false
      rollback_timeout:
        description: "Timeout in minutes before triggering rollback (only if auto_rollback_on_failure is true)"
        required: false
        type: number
        default: 10
      health_check_grace_period:
        description: "Grace period in seconds before starting health checks"
        required: false
        type: number
        default: 60
      environment:
        description: "Environment to deploy to (dev, staging, prod)"
        required: false
        type: string
        default: "dev"
    secrets:
      oidc_role_arn:
        description: "ARN of the AWS IAM role to assume for ECS deployment"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to ECS
        uses: ./aws/actions/deploy-ecs
        with:
          cluster_name: ${{ inputs.cluster_name }}
          service_name: ${{ inputs.service_name }}
          task_definition: ${{ inputs.task_definition }}
          image_uri: ${{ inputs.image_uri }}
          container_name: ${{ inputs.container_name }}
          aws_region: ${{ inputs.aws_region }}
          oidc_role_arn: ${{ secrets.oidc_role_arn }}
          wait_for_stability: ${{ inputs.wait_for_stability }}
          auto_rollback_on_failure: ${{ inputs.auto_rollback_on_failure }}
          rollback_timeout: ${{ inputs.rollback_timeout }}
          health_check_grace_period: ${{ inputs.health_check_grace_period }}

      - name: Deployment summary
        if: success()
        run: |
          echo "## ECS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: ${{ inputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ inputs.service_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ inputs.image_uri }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ inputs.aws_region }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ inputs.auto_rollback_on_failure }}" == "true" ]]; then
            echo "- **Auto-rollback**: Enabled (timeout: ${{ inputs.rollback_timeout }}m)" >> $GITHUB_STEP_SUMMARY
            echo "- **Health check grace period**: ${{ inputs.health_check_grace_period }}s" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Auto-rollback**: Disabled" >> $GITHUB_STEP_SUMMARY
          fi
